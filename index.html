<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manejo diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --papel: #E8EAE4;
    --cartao: #F7F8F5;
    --tinta: #1E2421;
    --suave: #56605A;
    --regua: #C9CFC8;
    --atraso: #B3261E;
    --atraso-fundo: #F6DEDB;
    --feito: #2E6B47;
    --feito-fundo: #DDEBE2;
    --aviso: #7A5600;
    --aviso-fundo: #F3E7C4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--papel); color: var(--tinta); }
  body {
    font-family: 'Barlow', system-ui, sans-serif;
    font-size: 18px;
    line-height: 1.4;
    padding: 0 0 96px;
    -webkit-text-size-adjust: 100%;
  }
  .topo { padding: 20px 20px 14px; border-bottom: 2px solid var(--tinta); }
  .topo h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 40px;
    line-height: 1;
    margin: 0 0 6px;
    letter-spacing: 0;
  }
  .topo .gerado { color: var(--suave); font-size: 15px; margin: 0; }
  .resumo {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 16px;
  }
  .resumo div { border-top: 4px solid var(--regua); padding-top: 6px; }
  .resumo div.r-atraso { border-color: var(--atraso); }
  .resumo div.r-hoje { border-color: var(--tinta); }
  .resumo div.r-aviso { border-color: var(--aviso); }
  .resumo b {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 44px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .resumo span { font-size: 15px; color: var(--suave); }

  main { padding: 0 20px; }
  .aba { display: none; }
  .aba.ativa { display: block; }
  .aba h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 26px;
    margin: 24px 0 8px;
  }
  .vazio { color: var(--suave); padding: 16px 0; }

  .grupo { margin-top: 18px; }
  .grupo h3 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 22px;
    margin: 0;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--regua);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .grupo h3 small { font-size: 16px; color: var(--suave); font-weight: 500; }
  .grupo.atrasadas h3 { color: var(--atraso); border-color: var(--atraso); }
  .grupo .grupo { margin-top: 10px; }
  .grupo .grupo h3 { font-size: 19px; border-bottom: 0; color: var(--suave); }

  .linha {
    display: grid;
    grid-template-columns: 112px 1fr auto;
    align-items: center;
    gap: 14px;
    min-height: 72px;
    padding: 10px 0;
    border-bottom: 1px solid var(--regua);
  }
  .brinco {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 34px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .info { display: flex; flex-direction: column; min-width: 0; }
  .tarefa-nome { font-weight: 600; font-size: 19px; }
  .meta { color: var(--suave); font-size: 15px; }
  .linha.atrasada .meta { color: var(--atraso); font-weight: 600; }
  .linha.aviso .tarefa-nome { color: var(--aviso); }
  .linha.marcada { background: var(--feito-fundo); }
  .marca-tag { color: var(--feito); font-weight: 600; }

  .feito-btn {
    min-width: 112px;
    min-height: 56px;
    padding: 0 18px;
    border: 2px solid var(--tinta);
    background: var(--cartao);
    color: var(--tinta);
    font: inherit;
    font-weight: 600;
    font-size: 18px;
    border-radius: 4px;
    cursor: pointer;
  }
  .feito-btn:active { background: var(--tinta); color: var(--cartao); }
  .feito-btn:disabled { opacity: .5; cursor: default; }
  .tag-aviso {
    background: var(--aviso-fundo);
    color: var(--aviso);
    font-weight: 600;
    font-size: 15px;
    padding: 8px 10px;
    border-radius: 4px;
    white-space: nowrap;
  }

  .alerta {
    padding: 14px;
    margin: 10px 0;
    border-left: 6px solid var(--atraso);
    background: var(--atraso-fundo);
  }
  .alerta.leve { border-color: var(--aviso); background: var(--aviso-fundo); }
  .alerta b { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; }

  .historico-linha {
    display: grid;
    grid-template-columns: 96px 1fr auto;
    gap: 12px;
    align-items: baseline;
    padding: 12px 0;
    border-bottom: 1px solid var(--regua);
  }
  .historico-linha .brinco { font-size: 26px; }
  .historico-linha .hora { color: var(--suave); font-variant-numeric: tabular-nums; }
  .feito-marca { color: var(--feito); font-weight: 600; }

  .banner {
    padding: 12px 14px;
    margin: 14px 0 0;
    background: var(--aviso-fundo);
    border-left: 6px solid var(--aviso);
  }

  .modo { display: flex; gap: 0; margin: 16px 0 4px; border: 2px solid var(--tinta); width: max-content; max-width: 100%; }
  .modo button {
    min-height: 48px;
    padding: 0 18px;
    border: 0;
    background: var(--cartao);
    color: var(--tinta);
    font: inherit;
    font-weight: 600;
    font-size: 17px;
    cursor: pointer;
  }
  .modo button + button { border-left: 2px solid var(--tinta); }
  .modo button.ativo { background: var(--tinta); color: var(--cartao); }

  .copiar.secundario { margin-top: 10px; background: var(--cartao); color: var(--tinta); }

  .entrar {
    position: fixed; inset: 0; z-index: 10; background: var(--papel);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .entrar[hidden] { display: none; }
  .entrar-caixa { width: 100%; max-width: 420px; }
  .entrar-caixa h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 32px; margin: 0 0 16px; }
  .entrar-nomes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .entrar-nomes button {
    min-height: 64px; border: 2px solid var(--tinta); background: var(--cartao); color: var(--tinta);
    font: inherit; font-weight: 600; font-size: 20px; cursor: pointer; border-radius: 4px;
  }
  .entrar-nomes button.ativo { background: var(--tinta); color: var(--cartao); }
  .entrar-pin { display: block; font-weight: 600; margin-bottom: 12px; }
  .entrar-pin input {
    display: block; width: 100%; min-height: 56px; margin-top: 6px; padding: 0 14px;
    font: inherit; font-size: 24px; border: 2px solid var(--tinta); background: var(--cartao);
  }
  .sair {
    margin-left: auto; min-height: 44px; padding: 0 12px; border: 2px solid var(--tinta);
    background: var(--cartao); font: inherit; font-weight: 600; cursor: pointer; border-radius: 4px;
  }
  .topo-linha { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .quem { color: var(--suave); font-size: 15px; }

  .mes-nav { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 14px 0 10px; }
  .mes-nav b { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 600; }
  .mes-nav button {
    min-height: 48px; padding: 0 14px; border: 2px solid var(--tinta); background: var(--cartao);
    font: inherit; font-weight: 600; font-size: 16px; color: var(--tinta); cursor: pointer; border-radius: 4px;
  }
  .grade { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .grade .cab { text-align: center; font-weight: 600; color: var(--suave); padding: 4px 0; font-size: 15px; }
  .grade .vazio-dia { min-height: 56px; }
  .dia {
    position: relative; min-height: 56px; border: 1px solid var(--regua); background: var(--cartao);
    color: var(--tinta); font: inherit; font-size: 18px; font-weight: 600; cursor: pointer; border-radius: 4px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 0;
    font-variant-numeric: tabular-nums;
  }
  .dia.hoje { border: 2px solid var(--tinta); }
  .dia.com small {
    margin-top: 2px; min-width: 22px; padding: 1px 6px; border-radius: 10px;
    background: var(--tinta); color: var(--cartao); font-size: 13px; font-weight: 600;
  }
  .dia.sel { background: var(--aviso-fundo); border-color: var(--aviso); }
  .detalhe { margin-top: 18px; border-top: 2px solid var(--tinta); padding-top: 6px; }
  .detalhe-titulo { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 600; margin: 8px 0; }
  .historico-linha { grid-template-columns: 84px 1fr auto auto; }
  .desfazer {
    min-height: 48px; padding: 0 12px; border: 2px solid var(--atraso); background: var(--cartao);
    color: var(--atraso); font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; border-radius: 4px;
  }
  .desfazer.confirmar { background: var(--atraso); color: var(--cartao); }
  .detalhe-titulo small { display: block; font-size: 16px; color: var(--suave); font-family: 'Barlow', sans-serif; }
  .copiar {
    margin-top: 16px;
    width: 100%;
    min-height: 56px;
    border: 2px solid var(--tinta);
    background: var(--tinta);
    color: var(--cartao);
    font: inherit;
    font-weight: 600;
    font-size: 18px;
    border-radius: 4px;
    cursor: pointer;
  }

  nav.abas {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    background: var(--tinta);
  }
  nav.abas button {
    min-height: 64px;
    border: 0;
    background: transparent;
    color: #AEB8B1;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  nav.abas button.ativa { color: #FFFFFF; box-shadow: inset 0 4px 0 #FFFFFF; }

  .proto { margin-top: 18px; border-top: 2px solid var(--tinta); padding-top: 8px; }
  .proto.ultimo { border-top-width: 6px; }
  .proto h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 600; margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .proto h3 small { font-family: 'Barlow', sans-serif; font-size: 16px; color: var(--suave); font-weight: 500; }
  .proto .selo { background: var(--tinta); color: var(--cartao); font-size: 14px; font-weight: 600; padding: 2px 8px; border-radius: 4px; font-family: 'Barlow', sans-serif; }
  .proto .vacas { color: var(--suave); font-size: 16px; margin: 4px 0 6px; word-break: break-word; }
  .proto .passo { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--regua); align-items: baseline; }
  .proto .passo.atrasado { color: var(--atraso); font-weight: 600; }
  .proto .passo .conta { color: var(--suave); font-variant-numeric: tabular-nums; }
  .ultimo-resumo { margin: 14px 0 0; padding: 12px 14px; background: var(--cartao); border-left: 6px solid var(--tinta); }

  button:focus-visible, a:focus-visible { outline: 3px solid var(--aviso); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  @media (max-width: 480px) {
    .resumo b { font-size: 36px; }
    .linha { grid-template-columns: 84px 1fr auto; gap: 10px; }
    .brinco { font-size: 28px; }
    .feito-btn { min-width: 96px; font-size: 17px; }
  }
</style>
</head>
<body>
<header class="topo">
  <div class="topo-linha">
    <h1 id="data-titulo">Manejo diário</h1>
    <button class="sair" id="sair" type="button" hidden>Trocar de pessoa</button>
  </div>
  <p class="gerado">Gerado em 05/10/2026, 17:23:50 <span class="quem" id="quem"></span></p>
  <div class="resumo" id="resumo"></div>
  <button class="copiar" id="copiar">Copiar resumo para o WhatsApp</button>
  <button class="copiar secundario" id="copiar-pev">Copiar protocolos PEV para o WhatsApp</button>
</header>
<main>
  <section id="hoje" class="aba ativa"></section>
  <section id="calendario" class="aba"></section>
  <section id="alertas" class="aba"><h2>Conflitos</h2><p class="vazio">Nenhum conflito entre protocolos.</p><h2>Cadastro</h2><p class="vazio">Nenhum aviso de cadastro.</p></section>
  <section id="abertos" class="aba"></section>
  <section id="historico" class="aba"></section>
</main>
<div class="entrar" id="entrar" hidden>
  <div class="entrar-caixa">
    <h2>Quem está marcando?</h2>
    <div id="entrar-nomes" class="entrar-nomes"></div>
    <label class="entrar-pin">PIN
      <input id="entrar-pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8">
    </label>
    <button class="copiar" id="entrar-ok" type="button">Entrar</button>
    <p class="banner" id="entrar-erro" hidden>PIN errado. Tente de novo.</p>
  </div>
</div>
<nav class="abas">
  <button data-aba="hoje" class="ativa">Hoje</button>
  <button data-aba="calendario">Calendário</button>
  <button data-aba="alertas">Alertas</button>
  <button data-aba="abertos">Em aberto</button>
  <button data-aba="historico">Histórico</button>
</nav>
<script>
// Sem imports: este arquivo também é copiado para o HTML do tablet.
function classificarTarefas(tarefas, checks, hoje) {
  const feitas = new Set(checks.map(c => c.tarefaId));
  const pendentes = tarefas.filter(t => !t.aviso && !feitas.has(t.id));
  const diasEntre = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000);
  const num = (a, b) => a.localeCompare(b, 'pt-BR', { numeric: true });
  const porLote = (a, b) => num(a.lote, b.lote) || num(a.brinco, b.brinco) || a.data.localeCompare(b.data);
  const porData = (a, b) => a.data.localeCompare(b.data) || porLote(a, b);
  return {
    atrasadas: pendentes
      .filter(t => t.data < hoje)
      .map(t => ({ ...t, diasAtraso: diasEntre(t.data, hoje) }))
      .sort(porData),
    hoje: pendentes.filter(t => t.data === hoje).sort(porLote),
    futuras: pendentes.filter(t => t.data > hoje).sort(porData),
    // Avisos (ex.: "Pula IA") aparecem sem botão de check, a partir de hoje.
    avisos: tarefas.filter(t => t.aviso && t.data >= hoje).sort(porData),
  };
}

// Leitura das marcações: qualquer resposta que não seja uma lista vira erro, nunca "tudo pendente" em silêncio.
function interpretarLeitura(json) {
  if (!json || json.ok === false || !Array.isArray(json.checks)) return { erro: true, checks: [] };
  return { erro: false, checks: json.checks };
}

// Gravação só conta como feita se a planilha respondeu ok:true.
function resultadoGravacao(json) {
  return !!(json && json.ok === true);
}

// Texto pronto para colar no WhatsApp: um bloco por manejo, com datas e brincos por lote.
function resumoWhatsApp(tarefas, checks, hoje) {
  const feitas = new Set(checks.map(c => c.tarefaId));
  const curto = iso => iso.slice(8, 10) + '/' + iso.slice(5, 7);
  const ordem = (a, b) => a.localeCompare(b, 'pt-BR', { numeric: true });
  const atrasadas = tarefas.filter(t => !t.aviso && !feitas.has(t.id) && t.data < hoje).length;
  const pendentes = tarefas.filter(t => !feitas.has(t.id) && t.data >= hoje);

  const porManejo = new Map();
  for (const t of pendentes) {
    const nome = t.aviso ? t.nome + ' (só aviso)' : t.nome;
    if (!porManejo.has(nome)) porManejo.set(nome, new Map());
    const porData = porManejo.get(nome);
    if (!porData.has(t.data)) porData.set(t.data, new Map());
    const porLote = porData.get(t.data);
    if (!porLote.has(t.lote)) porLote.set(t.lote, []);
    porLote.get(t.lote).push(t.brinco);
  }

  const linhas = ['*Manejo diário — ' + hoje.slice(8, 10) + '/' + hoje.slice(5, 7) + '/' + hoje.slice(0, 4) + '*'];
  if (atrasadas) linhas.push('Atrasadas: ' + atrasadas + ' (ver no painel)');
  for (const nome of [...porManejo.keys()].sort(ordem)) {
    linhas.push('', '*' + nome + '*');
    const porData = porManejo.get(nome);
    for (const data of [...porData.keys()].sort()) {
      const lotes = porData.get(data);
      const partes = [...lotes.keys()].sort(ordem).map(lote => lote + ': ' + lotes.get(lote).sort(ordem).join(', '));
      linhas.push(curto(data) + ': ' + partes.join('; '));
    }
  }
  return linhas.join('\n');
}

// Protocolos PEV, grupo por grupo: vacas do grupo e depois os passos em ordem (dia do protocolo, data, manejo).
function resumoPev(grupos, hoje) {
  const curto = iso => iso.slice(8, 10) + '/' + iso.slice(5, 7);
  const ordem = (a, b) => a.localeCompare(b, 'pt-BR', { numeric: true });
  const ativos = grupos.filter(g => g.passos.some(p => p.data >= hoje));
  const blocos = ativos.map(g => {
    const passos = g.passos.map((p, i) => (i + 1) + '. Dia ' + p.dia + ' — ' + curto(p.data) + ' — ' + p.nome + (p.aviso ? ' (só aviso)' : ''));
    return ['*PEV ' + curto(g.inicio) + ' — ' + g.vacas.length + ' vacas*', 'Vacas: ' + [...g.vacas].sort(ordem).join(', ')].concat(passos).join('\n');
  });
  return ['*Protocolos PEV — ' + hoje.slice(8, 10) + '/' + hoje.slice(5, 7) + '/' + hoje.slice(0, 4) + '*'].concat(blocos).join('\n\n');

function hojeISO() { const d = new Date(); const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function dataBR(iso) { const [a, m, d] = iso.split('-'); return d + '/' + m + '/' + a; }
function diaSemana(iso) {
  const [a, m, d] = iso.split('-').map(Number);
  return new Date(a, m - 1, d).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
}

let checks = [];
let marcacoes = [];
let leituraFalhou = false;
// Enquanto a primeira leitura não termina, não mostra as tarefas como pendentes (pareceria que as marcações sumiram).
let leituraOk = false;
let lendo = false;
let enviando = new Set();

// Tenta até 3 vezes: o Google às vezes devolve erro passageiro. Se falhar de vez, mantém o que já tinha lido.
async function carregarChecks() {
  if (lendo) return;
  lendo = true;
  let ok = false;
  for (let tentativa = 0; tentativa < 3 && !ok; tentativa++) {
    if (tentativa) await new Promise(r => setTimeout(r, 1000 * tentativa));
    try {
      const r = await fetch(DADOS.endpoint + '?token=' + encodeURIComponent(DADOS.token));
      const j = await r.json();
      const l = interpretarLeitura(j);
      if (l.erro) continue;
      marcacoes = Array.isArray(j.marcacoes) ? j.marcacoes : [];
      checks = l.checks;
      ok = true;
    } catch (e) { /* tenta de novo */ }
  }
  lendo = false;
  leituraFalhou = !ok && !leituraOk;
  if (ok) leituraOk = true;
  desenhar();
}

// Ao voltar para a aba ou abrir de novo o aparelho, relê: assim as marcações feitas em outro aparelho aparecem.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') carregarChecks(); });

// Cor fixa por tipo de manejo: quem marca vê de longe o que é cada grupo.
const CORES_MANEJO = { 'Sincroforte': '#2B6CB0', 'PG': '#C05621', 'ECP + PG': '#2F855A', 'PG + ECP': '#6B46C1', 'IA': '#B83280', 'Pula IA': '#8A5A00', 'E. coli dose 1': '#00838F', 'E. coli dose 2': '#4A5568' };
const PALETA_EXTRA = ['#975A16', '#2C7A7B', '#9B2C2C', '#553C9A'];
function corManejo(nome) {
  if (CORES_MANEJO[nome]) return CORES_MANEJO[nome];
  let h = 0;
  for (const ch of String(nome)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return PALETA_EXTRA[h % PALETA_EXTRA.length];
}

// Ricardo e Felipe só marcam o animal para separar; a tarefa continua pendente para quem dá a baixa.
function ehMarcador() {
  const s = sessao();
  return !!(s && DADOS.marcadores.includes(s.usuario));
}
function marcacaoDe(id) { return marcacoes.find(k => k.tarefaId === id); }

function linha(t, atrasada) {
  const feito = enviando.has(t.id);
  const m = marcacaoDe(t.id);
  const meta = dataBR(t.data) + ' · ' + esc(t.lote) + (atrasada ? ' · ' + t.diasAtraso + ' dia(s) de atraso' : '') +
    (m ? ' · <span class="marca-tag">Marcado por ' + esc(m.quem) + '</span>' : '');
  let acao;
  if (t.aviso) acao = '<span class="tag-aviso">Só aviso</span>';
  else if (ehMarcador()) {
    const meu = m && sessao() && m.quem === sessao().usuario;
    acao = m
      ? (meu ? '<button class="feito-btn" data-desmarcar="' + esc(t.id) + '">Desmarcar</button>' : '<span class="tag-aviso">Marcado</span>')
      : '<button class="feito-btn" data-marcar="' + esc(t.id) + '" ' + (feito ? 'disabled' : '') + '>' + (feito ? 'Gravando' : 'Marcar') + '</button>';
  } else acao = '<button class="feito-btn" data-id="' + esc(t.id) + '" ' + (feito ? 'disabled' : '') + '>' + (feito ? 'Gravando' : 'Feito') + '</button>';
  return '<div class="linha' + (atrasada ? ' atrasada' : '') + (t.aviso ? ' aviso' : '') + (m ? ' marcada' : '') + '" style="border-left: 8px solid ' + corManejo(t.nome) + '; padding-left: 12px">' +
    '<div class="brinco">' + esc(t.brinco) + '</div>' +
    '<div class="info"><span class="tarefa-nome">' + esc(t.nome) + '</span><span class="meta">' + meta + '</span></div>' +
    acao + '</div>';
}

function porLote(lista, atrasada) {
  const grupos = new Map();
  for (const t of lista) {
    if (!grupos.has(t.lote)) grupos.set(t.lote, []);
    grupos.get(t.lote).push(t);
  }
  return [...grupos.entries()].map(([lote, itens]) =>
    '<div class="grupo' + (atrasada ? ' atrasadas' : '') + '"><h3>' + (atrasada ? 'Atrasadas · ' : '') + esc(lote) +
    '<small>' + itens.length + '</small></h3>' +
    itens.map(t => linha(t, atrasada)).join('') + '</div>'
  ).join('');
}

// Dia primeiro; dentro do dia, cada lote fica junto com o seu nome.
function porData(lista) {
  const datas = [...new Set(lista.map(t => t.data))].sort();
  return datas.map(d => '<div class="grupo"><h3>' + esc(diaSemana(d)) + '<small>' + dataBR(d) + '</small></h3>' +
    agrupar(lista.filter(t => t.data === d), false) + '</div>').join('');
}

// Dois modos de agrupar: por lote (como sempre) ou por manejo (o que aplicar), para levar uma cor de cada vez.
let modo = 'lote';
try { modo = localStorage.getItem('manejo-modo') === 'manejo' ? 'manejo' : 'lote'; } catch (e) { modo = 'lote'; }

function seletorModo() {
  return '<div class="modo" role="group" aria-label="Agrupar por">' +
    '<button data-modo="lote" class="' + (modo === 'lote' ? 'ativo' : '') + '">Por lote</button>' +
    '<button data-modo="manejo" class="' + (modo === 'manejo' ? 'ativo' : '') + '">Por manejo</button></div>';
}

function porManejo(lista, atrasada) {
  const grupos = new Map();
  for (const t of lista) {
    if (!grupos.has(t.nome)) grupos.set(t.nome, []);
    grupos.get(t.nome).push(t);
  }
  return [...grupos.entries()].sort(([a], [b]) => a.localeCompare(b)).map(([nome, itens]) =>
    '<div class="grupo' + (atrasada ? ' atrasadas' : '') + '"><h3 style="border-left: 8px solid ' + corManejo(nome) + '; padding-left: 10px">' + (atrasada ? 'Atrasadas · ' : '') + esc(nome) +
    '<small>' + itens.length + '</small></h3>' +
    itens.sort((a, b) => a.lote.localeCompare(b.lote, 'pt-BR', { numeric: true }) || a.brinco.localeCompare(b.brinco, 'pt-BR', { numeric: true })).map(t => linha(t, atrasada)).join('') + '</div>'
  ).join('');
}

function agrupar(lista, atrasada) {
  return modo === 'manejo' ? porManejo(lista, atrasada) : porLote(lista, atrasada);
}

// Calendário: lista (como antes) ou grade do mês com a contagem de tarefas em cada dia.
let vista = 'lista';
try { vista = localStorage.getItem('calendario-vista') === 'mes' ? 'mes' : 'lista'; } catch (e) { vista = 'lista'; }
let mesRef = null;
let diaSel = null;

function seletorVista() {
  return '<div class="modo" role="group" aria-label="Forma do calendário">' +
    '<button data-vista="lista" class="' + (vista === 'lista' ? 'ativo' : '') + '">Lista</button>' +
    '<button data-vista="mes" class="' + (vista === 'mes' ? 'ativo' : '') + '">Mês</button></div>';
}

function calendarioMes(agenda, hoje) {
  if (!mesRef) mesRef = hoje.slice(0, 7);
  if (!diaSel && mesRef === hoje.slice(0, 7)) diaSel = hoje;
  const [ano, mes] = mesRef.split('-').map(Number);
  const primeiro = new Date(ano, mes - 1, 1);
  const diasNoMes = new Date(ano, mes, 0).getDate();
  const nomeMesBruto = primeiro.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  const nomeMes = nomeMesBruto.charAt(0).toUpperCase() + nomeMesBruto.slice(1);
  const contagem = new Map();
  for (const t of agenda) contagem.set(t.data, (contagem.get(t.data) || 0) + 1);

  let html = '<div class="mes-nav"><button data-mes="-1">Anterior</button><b>' + esc(nomeMes) + '</b><button data-mes="1">Próximo</button></div>';
  html += '<div class="grade">' + ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map(l => '<div class="cab">' + l + '</div>').join('');
  for (let i = 0; i < primeiro.getDay(); i++) html += '<div class="vazio-dia"></div>';
  for (let d = 1; d <= diasNoMes; d++) {
    const iso = mesRef + '-' + String(d).padStart(2, '0');
    const n = contagem.get(iso) || 0;
    html += '<button class="dia' + (iso === hoje ? ' hoje' : '') + (iso === diaSel ? ' sel' : '') + (n ? ' com' : '') +
      '" data-dia="' + iso + '" aria-label="Dia ' + d + (n ? ', ' + n + ' tarefas' : '') + '"><span>' + d + '</span>' +
      (n ? '<small>' + n + '</small>' : '') + '</button>';
  }
  html += '</div>';

  if (diaSel && diaSel.slice(0, 7) === mesRef) {
    const doDia = agenda.filter(t => t.data === diaSel);
    html += '<div class="detalhe"><h3 class="detalhe-titulo">' + esc(diaSemana(diaSel)) + '<small>' + dataBR(diaSel) + '</small></h3>' +
      (doDia.length ? agrupar(doDia, false) : '<p class="vazio">Nada programado neste dia.</p>') + '</div>';
  } else {
    html += '<p class="vazio">Toque em um dia para ver os manejos.</p>';
  }
  return html;
}

let desfazerPendente = null;

function linhaFeita(k) {
  const s = sessao();
  const pode = s && k.quem === s.usuario;
  const botao = pode
    ? '<button class="desfazer' + (desfazerPendente === k.tarefaId ? ' confirmar' : '') + '" data-desfazer="' + esc(k.tarefaId) + '">' +
      (desfazerPendente === k.tarefaId ? 'Confirmar' : 'Desfazer') + '</button>'
    : '';
  return '<div class="historico-linha"><span class="brinco">' + esc(k.brinco) + '</span>' +
    '<span>' + esc(k.nome) + '<br><span class="meta">' + esc(k.lote || '') + ' · ' + esc(k.dataFeita) + (k.quem ? ' · ' + esc(k.quem) : '') + '</span></span>' +
    '<span class="hora feito-marca">' + esc(k.hora) + '</span>' + botao + '</div>';
}

async function desfazer(id) {
  const s = sessao();
  if (!s) { mostrarEntrar(); return; }
  let j = { ok: false };
  try {
    const r = await fetch(DADOS.endpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ token: DADOS.token, acao: 'desfazer', usuario: s.usuario, pin: s.pin, tarefaId: id }) });
    j = await r.json();
  } catch (e) { j = { ok: false }; }
  desfazerPendente = null;
  if (j.ok) {
    checks = checks.filter(c => c.tarefaId !== id);
  } else {
    alert(j.motivo === 'outro' ? 'Só quem marcou pode desfazer esta marcação.' : 'Não consegui desfazer. Tente de novo.');
  }
  desenhar();
}

function desenhar() {
  const hoje = hojeISO();
  const c = classificarTarefas(DADOS.tarefas, checks, hoje);
  const avisosHoje = c.avisos.filter(t => t.data === hoje);
  const pendentesHoje = c.hoje.length;

  document.getElementById('data-titulo').textContent = diaSemana(hoje);
  document.getElementById('resumo').innerHTML =
    '<div class="r-atraso"><b>' + c.atrasadas.length + '</b><span>atrasadas</span></div>' +
    '<div class="r-hoje"><b>' + pendentesHoje + '</b><span>para hoje</span></div>' +
    '<div class="r-aviso"><b>' + avisosHoje.length + '</b><span>avisos</span></div>';

  const banner = leituraFalhou
    ? '<p class="banner">Não consegui ler as marcações: o que aparece pendente pode já ter sido feito. Antes de dar qualquer dose, confira no caderno. <button class="feito-btn" data-recarregar="1" style="margin-top:8px">Tentar de novo</button></p>'
    : '';
  const carregando = !leituraOk && !leituraFalhou;
  const semPendencia = c.atrasadas.length + pendentesHoje === 0
    ? '<p class="vazio">Nada pendente para hoje.</p>' : '';
  document.getElementById('hoje').innerHTML = carregando ? '<p class="vazio">Carregando as marcações…</p>' :
    banner + seletorModo() +
    agrupar(c.atrasadas, true) +
    agrupar(c.hoje, false) +
    (avisosHoje.length ? agrupar(avisosHoje, false) : '') +
    semPendencia;

  const proximos = [...c.futuras, ...c.avisos.filter(t => t.data > hoje)]
    .sort((a, b) => a.data.localeCompare(b.data) || a.lote.localeCompare(b.lote, 'pt-BR', { numeric: true }) || a.brinco.localeCompare(b.brinco, 'pt-BR', { numeric: true }))
    .slice(0, 200);
  const agenda = [...c.hoje, ...c.futuras, ...c.avisos.filter(t => t.data >= hoje)];
  const corpoCalendario = vista === 'mes'
    ? calendarioMes(agenda, hoje)
    : '<h2>Próximos dias</h2>' + (proximos.length ? porData(proximos) : '<p class="vazio">Nenhuma tarefa programada.</p>');
  document.getElementById('calendario').innerHTML = seletorVista() + seletorModo() + corpoCalendario;

  document.getElementById('abertos').innerHTML = carregando ? '<p class="vazio">Carregando as marcações…</p>' : abertosHtml(hoje);

  const feitos = checks.slice().sort((a, b) => (String(b.dataFeita) + String(b.hora)).localeCompare(String(a.dataFeita) + String(a.hora)));
  let corpoHistorico = '<p class="vazio">Nenhuma marcação ainda.</p>';
  if (feitos.length) {
    const chave = modo === 'manejo' ? 'nome' : 'lote';
    const grupos = new Map();
    for (const k of feitos) {
      const g = String(k[chave] || 'Sem lote');
      if (!grupos.has(g)) grupos.set(g, []);
      grupos.get(g).push(k);
    }
    corpoHistorico = [...grupos.entries()].sort(([a], [b]) => a.localeCompare(b)).map(([g, itens]) =>
      '<div class="grupo"><h3>' + esc(g) + '<small>' + itens.length + '</small></h3>' +
      itens.map(linhaFeita).join('') + '</div>').join('');
  }
  document.getElementById('historico').innerHTML = seletorModo() + '<h2>Feitos</h2>' + corpoHistorico;
}

// Lançamentos com ao menos um passo sem check, por data do lançamento (o mais recente fica marcado).
function abertosHtml(hoje) {
  const feitas = new Set(checks.map(c => c.tarefaId));
  const ordem = (a, b) => a.localeCompare(b, 'pt-BR', { numeric: true });
  const loteDe = new Map(DADOS.tarefas.map(t => [t.brinco, t.lote]));
  const vacasPorLote = p => {
    const m = new Map();
    for (const b of p.vacas) { const l = loteDe.get(b) || 'Sem lote'; if (!m.has(l)) m.set(l, []); m.get(l).push(b); }
    return [...m.entries()].sort(([a], [b]) => ordem(a, b)).map(([l, bs]) => '<b>' + esc(l) + ':</b> ' + esc(bs.sort(ordem).join(', '))).join('<br>');
  };
  const lista = [];
  for (const p of DADOS.protocolos) {
    const passos = new Map();
    for (const t of DADOS.tarefas) {
      if (t.eventoId !== p.eventoId) continue;
      const k = t.data + '|' + t.nome;
      if (!passos.has(k)) passos.set(k, { data: t.data, nome: t.nome, aviso: t.aviso, total: 0, feitas: 0 });
      const s = passos.get(k);
      s.total++;
      if (feitas.has(t.id)) s.feitas++;
    }
    const todos = [...passos.values()].sort((a, b) => a.data.localeCompare(b.data));
    if (todos.some(s => !s.aviso && s.feitas < s.total)) lista.push({ p, passos: todos });
  }
  lista.sort((a, b) => a.p.data.localeCompare(b.p.data) || a.p.eventoId.localeCompare(b.p.eventoId));

  // Último lançamento de todos, aberto ou não: é a referência para montar a próxima lista.
  const ultimo = DADOS.protocolos.slice().sort((a, b) => b.data.localeCompare(a.data) || b.eventoId.localeCompare(a.eventoId))[0];
  let html = '<h2>Protocolos em aberto</h2>';
  if (ultimo) {
    html += '<p class="ultimo-resumo"><b>Último lançado:</b> ' + esc(ultimo.rotulo) + ' de ' + dataBR(ultimo.data) + ' · ' + ultimo.vacas.length + ' vacas<br><span class="meta">' +
      vacasPorLote(ultimo) + '</span></p>';
  }
  if (!lista.length) return html + '<p class="vazio">Nenhum protocolo em aberto.</p>';
  const maisRecente = lista[lista.length - 1].p.eventoId;
  html += lista.map(({ p, passos }) =>
    '<div class="proto' + (p.eventoId === maisRecente ? ' ultimo' : '') + '"><h3><span>' + esc(p.rotulo) + ' · ' + dataBR(p.data) +
    (p.eventoId === maisRecente ? ' <span class="selo">mais recente</span>' : '') + '</span><small>' + p.vacas.length + ' vacas</small></h3>' +
    '<div class="vacas">' + vacasPorLote(p) + '</div>' +
    passos.map(s => {
      const atrasado = !s.aviso && s.feitas < s.total && s.data < hoje;
      return '<div class="passo' + (atrasado ? ' atrasado' : '') + '"><span>' + dataBR(s.data).slice(0, 5) + '</span><span>' + esc(s.nome) + (s.aviso ? ' (só aviso)' : '') + '</span>' +
        '<span class="conta">' + (s.aviso ? '' : (s.feitas >= s.total ? 'feito' : s.feitas + '/' + s.total)) + '</span></div>';
    }).join('') + '</div>').join('');
  return html;
}

// Marcação de animal (Ricardo e Felipe): grava na aba Marcados, não conta como baixa.
async function marcarAnimal(id, desfazerMarca) {
  const s = sessao();
  if (!s) { mostrarEntrar(); return; }
  const t = DADOS.tarefas.find(x => x.id === id);
  if (!t || enviando.has(id)) return;
  enviando.add(id);
  desenhar();
  const agora = new Date();
  const hora = String(agora.getHours()).padStart(2, '0') + ':' + String(agora.getMinutes()).padStart(2, '0');
  const corpo = { token: DADOS.token, usuario: s.usuario, pin: s.pin, acao: desfazerMarca ? 'desmarcar' : 'marcar', tarefaId: t.id, brinco: t.brinco, lote: t.lote, nome: t.nome, dataPrevista: t.data, dataFeita: hojeISO(), hora };
  try {
    const r = await fetch(DADOS.endpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(corpo) });
    if (!resultadoGravacao(await r.json())) throw new Error('planilha recusou');
    if (desfazerMarca) marcacoes = marcacoes.filter(k => k.tarefaId !== id);
    else marcacoes.push({ tarefaId: t.id, brinco: t.brinco, lote: t.lote, nome: t.nome, dataFeita: corpo.dataFeita, hora, quem: s.usuario });
  } catch (e) {
    alert('Não consegui gravar a marcação. Toque de novo.');
  } finally {
    enviando.delete(id);
    desenhar();
  }
}

async function marcar(id) {
  if (ehMarcador()) return;
  if (enviando.has(id)) return;
  const t = DADOS.tarefas.find(x => x.id === id);
  if (!t) return;
  enviando.add(id);
  desenhar();
  const agora = new Date();
  const hora = String(agora.getHours()).padStart(2, '0') + ':' + String(agora.getMinutes()).padStart(2, '0');
  const dataFeita = hojeISO();
  const s = sessao();
  if (!s) { enviando.delete(id); mostrarEntrar(); return; }
  const corpo = { token: DADOS.token, usuario: s.usuario, pin: s.pin, tarefaId: t.id, brinco: t.brinco, lote: t.lote, nome: t.nome, dataPrevista: t.data, dataFeita, hora };
  try {
    const r = await fetch(DADOS.endpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(corpo) });
    const j = await r.json();
    // Só conta como feito se a planilha confirmou. Erro de token ou de planilha volta como ok:false.
    if (!resultadoGravacao(j)) throw new Error('planilha recusou');
    checks.push({ tarefaId: t.id, brinco: t.brinco, lote: t.lote, nome: t.nome, dataFeita, hora, quem: s.usuario });
  } catch (e) {
    alert('Não consegui gravar. A tarefa continua pendente; toque em Feito de novo.');
  } finally {
    enviando.delete(id);
    desenhar();
  }
}

// Copia um texto para colar no WhatsApp. Quem envia é você, dentro do WhatsApp.
async function copiarTexto(botao, texto, rotulo) {
  let ok = false;
  try {
    await navigator.clipboard.writeText(texto);
    ok = true;
  } catch (e) {
    const area = document.createElement('textarea');
    area.value = texto;
    document.body.appendChild(area);
    area.select();
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    area.remove();
  }
  botao.textContent = ok ? 'Copiado: cole no WhatsApp' : 'Não consegui copiar';
  setTimeout(() => { botao.textContent = rotulo; }, 2500);
}

function copiarResumo(botao) {
  copiarTexto(botao, resumoWhatsApp(DADOS.tarefas, checks, hojeISO()), 'Copiar resumo para o WhatsApp');
}

function copiarPev(botao) {
  copiarTexto(botao, resumoPev(DADOS.grupos, hojeISO()), 'Copiar protocolos PEV para o WhatsApp');
}

document.addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b) return;
  if (b.id === 'copiar') {
    copiarResumo(b);
    return;
  }
  if (b.id === 'copiar-pev') {
    copiarPev(b);
    return;
  }
  if (b.dataset.aba) {
    document.querySelectorAll('nav.abas button').forEach(x => x.classList.toggle('ativa', x === b));
    document.querySelectorAll('.aba').forEach(s => s.classList.toggle('ativa', s.id === b.dataset.aba));
    window.scrollTo(0, 0);
  } else if (b.dataset.vista) {
    vista = b.dataset.vista;
    try { localStorage.setItem('calendario-vista', vista); } catch (e) { /* sem armazenamento: só nesta sessão */ }
    desenhar();
  } else if (b.dataset.mes) {
    const [a, m] = (mesRef || hojeISO().slice(0, 7)).split('-').map(Number);
    const novo = new Date(a, m - 1 + Number(b.dataset.mes), 1);
    mesRef = novo.getFullYear() + '-' + String(novo.getMonth() + 1).padStart(2, '0');
    diaSel = null;
    desenhar();
  } else if (b.dataset.dia) {
    diaSel = b.dataset.dia;
    desenhar();
  } else if (b.dataset.desfazer) {
    const id = b.dataset.desfazer;
    if (desfazerPendente !== id) {
      desfazerPendente = id;
      desenhar();
    } else {
      desfazer(id);
    }
  } else if (b.dataset.modo) {
    modo = b.dataset.modo;
    try { localStorage.setItem('manejo-modo', modo); } catch (e) { /* sem armazenamento: só nesta sessão */ }
    desenhar();
  } else if (b.dataset.recarregar) {
    leituraFalhou = false;
    desenhar();
    carregarChecks();
  } else if (b.dataset.marcar) {
    marcarAnimal(b.dataset.marcar, false);
  } else if (b.dataset.desmarcar) {
    marcarAnimal(b.dataset.desmarcar, true);
  } else if (b.dataset.id) {
    marcar(b.dataset.id);
  }
});

// Login: cada pessoa escolhe o nome e digita o PIN. A sessão fica guardada neste aparelho.
function sessao() {
  try { const s = JSON.parse(localStorage.getItem('manejo-sessao')); return s && s.usuario && s.pin ? s : null; } catch (e) { return null; }
}

let usuarioEscolhido = null;

function mostrarEntrar() {
  usuarioEscolhido = null;
  document.getElementById('entrar-nomes').innerHTML = DADOS.usuarios.map(n => '<button type="button" data-usuario="' + esc(n) + '">' + esc(n) + '</button>').join('');
  document.getElementById('entrar-pin').value = '';
  document.getElementById('entrar-erro').hidden = true;
  document.getElementById('entrar').hidden = false;
}

async function entrarComPin() {
  const pin = document.getElementById('entrar-pin').value.trim();
  if (!usuarioEscolhido || !pin) return;
  let ok = false;
  try {
    const r = await fetch(DADOS.endpoint + '?token=' + encodeURIComponent(DADOS.token) + '&entrar=1&usuario=' + encodeURIComponent(usuarioEscolhido) + '&pin=' + encodeURIComponent(pin));
    ok = (await r.json()).ok === true;
  } catch (e) { ok = false; }
  if (!ok) { document.getElementById('entrar-erro').hidden = false; return; }
  try { localStorage.setItem('manejo-sessao', JSON.stringify({ usuario: usuarioEscolhido, pin })); } catch (e) { /* sem armazenamento: pede de novo na próxima vez */ }
  document.getElementById('entrar').hidden = true;
  atualizarQuem();
  desenhar();
}

function atualizarQuem() {
  const s = sessao();
  document.getElementById('quem').textContent = s ? (DADOS.marcadores.includes(s.usuario) ? '· marcando animais como ' + s.usuario + ' (sem baixa)' : '· marcando como ' + s.usuario) : '';
  document.getElementById('sair').hidden = !s;
}

document.getElementById('entrar-ok').addEventListener('click', entrarComPin);
document.getElementById('entrar-nomes').addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b) return;
  usuarioEscolhido = b.dataset.usuario;
  document.querySelectorAll('#entrar-nomes button').forEach(x => x.classList.toggle('ativo', x === b));
  document.getElementById('entrar-pin').focus();
});
document.getElementById('sair').addEventListener('click', () => {
  try { localStorage.removeItem('manejo-sessao'); } catch (e) { /* nada a limpar */ }
  atualizarQuem();
  mostrarEntrar();
});

atualizarQuem();
if (!sessao()) mostrarEntrar();
desenhar();
carregarChecks();
</script>

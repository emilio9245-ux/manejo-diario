const decifrar = async function decifrar({ sal, iv, ct }, senha) {
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
  const chave = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(sal), iterations: 200000, hash: 'SHA-256' },
    base,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
  const bytes = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(iv) }, chave, b64(ct));
  return new TextDecoder().decode(bytes);
};

  ev.preventDefault();
  try {
    const html = await decifrar(PACOTE, document.getElementById('senha').value);
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById('erro').textContent = 'Senha errada.';
  }
});
